<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>livemap — viewer</title>
    <link rel="stylesheet" href="/maplibre-gl.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #eae6df; }
      #map { position: absolute; inset: 0 0 34px 0; }
      #status {
        position: absolute; inset-inline: 0; bottom: 0; height: 34px;
        display: flex; align-items: center; gap: 12px; padding-inline: 14px;
        background: #16130f; color: #e8e1d6;
        font: 12.5px ui-monospace, "SF Mono", Menlo, monospace;
      }
      #status a { color: #e8a33d; text-decoration: none; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="status">loading…</div>
    <script type="module" src="/dist/demo.js"></script>
  </body>
</html>
