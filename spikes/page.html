<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>livemap annotation spike</title>
    <link rel="stylesheet" href="./maplibre-gl.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #eae6df;
      }
      #map {
        position: absolute;
        inset: 0;
      }
      /* Hide the canvas focus ring so screenshots are clean. */
      .maplibregl-canvas:focus {
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script type="module" src="./dist/app.js"></script>
  </body>
</html>
