# livemap on the shared platform box. Uses the platform's postgres (database
# `livemap`, PostGIS). Ingress: a Cloudflare Tunnel → server:8787. Deployed by
# .github/workflows/deploy.yml; app secrets come from the box's environment.
#
# Migrations run as the cluster superuser, because 0001 alters its own role to
# BYPASSRLS; only the one-shot `migrate` service sees that credential.

name: livemap

networks:
  platform:
    external: true

x-env: &env
  NODE_ENV: production
  APP_DATABASE_URL: postgres://livemap_app:${APP_DB_PASSWORD:?}@postgres:5432/livemap
  ADMIN_DATABASE_URL: postgres://livemap_admin:${ADMIN_DB_PASSWORD:?}@postgres:5432/livemap
  SESSION_SECRET: ${SESSION_SECRET:?}
  LOG_LEVEL: info
  # cloudflared reaches the server over the compose network.
  TRUST_PROXY: 172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
  R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?}
  R2_BUCKET: ${R2_BUCKET:?}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?}
  PUBLIC_ARTIFACT_BASE: ${PUBLIC_ARTIFACT_BASE:?}
  GUEST_SIGNUP: 'on'
  TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?}
  TURNSTILE_SECRET: ${TURNSTILE_SECRET:?}

services:
  server:
    image: livemap-server:${TAG:?}
    restart: unless-stopped
    networks: [default, platform]
    environment:
      <<: *env
      DB_POOL_MAX: '10'
    mem_limit: 512m
    mem_reservation: 256m

  # Expired guest workspaces must be reaped by something outside the server.
  reaper:
    image: livemap-server:${TAG:?}
    restart: unless-stopped
    networks: [platform]
    healthcheck:
      disable: true
    command: ['sh', '-c', 'while true; do node --conditions=livemap-source --import tsx scripts/reap-guests.mjs || true; sleep 3600; done']
    environment:
      <<: *env
    mem_limit: 192m

  migrate:
    image: livemap-server:${TAG:?}
    profiles: ['ops']
    networks: [platform]
    healthcheck:
      disable: true
    command: ['node', 'scripts/migrate.mjs', 'up']
    environment:
      DATABASE_URL: postgres://postgres:${PG_SUPERUSER_PASSWORD:?}@postgres:5432/livemap
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:?}
    restart: 'no'

  cloudflared:
    image: cloudflare/cloudflared:2026.11.2
    restart: unless-stopped
    command: ['tunnel', '--no-autoupdate', 'run']
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?}
    depends_on: [server]
    mem_limit: 64m
